<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE GARDEN CAFE (Est. 2018) | Where Coffee Blooms</title>
    <meta name="description" content="Step into The Garden Cafe — a cozy garden-themed sanctuary serving artisanal pour-overs, garden-fresh bites, and handcrafted brews amidst blooming greenery since 2018." />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="THE GARDEN CAFE — Where Coffee Blooms" />
    <meta property="og:description" content="Artisanal coffee, wood-fired bites & serene garden seating. Established 2018." />
    <meta property="og:image" content="/logo.png" />
    <meta name="theme-color" content="#F6EFDC" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&family=Josefin+Sans:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Nunito:ital,wght@0,300..1000;1,300..1000&family=Rozha+One&display=swap" rel="stylesheet">
  </head>
  <body class="bg-cream-200 text-espresso font-body antialiased selection:bg-olive selection:text-cream-100 overflow-x-hidden">
    <!-- SVG Grain Noise Filter Definition for Handcrafted Texture -->
    <svg class="hidden" aria-hidden="true">
      <filter id="paper-grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.16  0 0 0 0 0.12  0 0 0 0.04 0" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
